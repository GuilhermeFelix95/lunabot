# O CI roda só manualmente, a pedido do usuário. Não há gatilho de push nem de
# pull_request. Para disparar, use: gh workflow run ci.yml --ref <branch>
name: CI

on:
  workflow_dispatch:

jobs:
  qualidade:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test
